# ============================================================
# 熊浩 | Academic Homepage
# CareerCanvas + Hugo
# ============================================================

baseURL = "/"
locale = "zh-CN"
title = "熊浩 | 个人主页"
theme = "careercanvas"

defaultContentLanguage = "zh"
defaultContentLanguageInSubdir = false


# ============================================================
# 中文
# ============================================================

[languages]

  [languages.zh]

    contentDir = "content/zh"
    label = "中文"
    languageCode = "zh-CN"
    languageName = "中文"
    title = "熊浩 | 个人主页"
    weight = 1

    [languages.zh.params]

      # 首页主标题
      tagline = "能源与动力工程 · 氢能 · 机器学习"

      # 首页个人简介
      hero_description = "华中科技大学能源与动力工程专业硕士研究生，关注氢能、可再生能源、机器学习与数据驱动能源系统。"

      # 所在地
      hero_location = "武汉，中国"

      # 首页标签
      collab_tags = [
        "Hydrogen Energy",
        "Renewable Energy",
        "Machine Learning"
      ]

      copyright = "熊浩"
      resume_url = "/files/xiong-hao-cv.pdf"
      article_date_format = "2006 年 01 月 02 日"

    [[languages.zh.menus.main]]
      name = "首页"
      url = "#home"
      weight = 10

    [[languages.zh.menus.main]]
      name = "关于"
      url = "#about"
      weight = 20

    [[languages.zh.menus.main]]
      name = "项目"
      pageRef = "/projects"
      weight = 40

    [[languages.zh.menus.main]]
      name = "简历"
      url = "/files/xiong-hao-cv.pdf"
      weight = 50

    [[languages.zh.menus.main]]
      name = "博客"
      pageRef = "/blog"
      weight = 60

    [[languages.zh.menus.main]]
      name = "联系"
      url = "#contact"
      weight = 70

    [[languages.zh.menus.main]]
      name = "证书"
      pageRef = "/certificates"
      weight = 75


# ============================================================
# English language site configuration
# ============================================================

  [languages.en]

    contentDir = "content/en"
    label = "English"
    languageCode = "en"
    languageName = "English"
    title = "Hao Xiong | Academic Homepage"
    weight = 2

    [languages.en.params]

      name = "Hao Xiong"
      firstName = "Hao"
      lastName = "Xiong"
      author = "Hao Xiong"

      tagline = "Energy and Power Engineering · Hydrogen Energy · Machine Learning"
      hero_description = "MEng student in Energy and Power Engineering at Huazhong University of Science and Technology, with interests in hydrogen energy, renewable energy, machine learning, and data-driven energy systems."
      hero_location = "Wuhan, China"
      description = "Hao Xiong's academic homepage — energy and power engineering, hydrogen energy, renewable energy, machine learning, and data-driven energy systems."

      collab_tags = [
        "Hydrogen Energy",
        "Renewable Energy",
        "Machine Learning"
      ]

      copyright = "Hao Xiong"
      resume_url = "/files/xiong-hao-cv.pdf"
      article_date_format = "January 2, 2006"

    [[languages.en.menus.main]]
      name = "Home"
      url = "#home"
      weight = 10

    [[languages.en.menus.main]]
      name = "About"
      url = "#about"
      weight = 20

    [[languages.en.menus.main]]
      name = "Projects"
      pageRef = "/projects"
      weight = 40

    [[languages.en.menus.main]]
      name = "CV"
      url = "/files/xiong-hao-cv.pdf"
      weight = 50

    [[languages.en.menus.main]]
      name = "Blog"
      pageRef = "/blog"
      weight = 60

    [[languages.en.menus.main]]
      name = "Contact"
      url = "#contact"
      weight = 70

    [[languages.en.menus.main]]
      name = "Certificates"
      pageRef = "/certificates"
      weight = 75


# ============================================================
# 构建
# ============================================================

[build]
  writeStats = true


# ============================================================
# 个人信息
# ============================================================

[params]

  name = "熊浩"
  firstName = "熊"
  lastName = "浩"

  # 学术公开邮箱
  email = "xionghao_research@163.com"

  # 头像
  profile_image = "/images/profile.jpg"

  # 作者
  author = "熊浩"

  # SEO / Open Graph 图片
  og_image = "/images/profile.jpg"

  # 网站描述
  description = "熊浩的个人学术主页——能源与动力工程、氢能、可再生能源、机器学习与数据驱动能源系统。"


  # ==========================================================
  # 社交账号
  # ==========================================================

  # LinkedIn
  linkedin_url = ""
  linkedin_text = ""

  # GitHub
  github_url = "https://github.com/xiong-H6776"
  github_text = "github.com/xiong-H6776"


  # ==========================================================
  # 其他功能
  # ==========================================================

  calendly_url = ""
  calendly_height = "700px"

  copyright = "© 2026 | 熊浩"

  # 暂时没有英文 / 法文简历
  resume_url = "/files/xiong-hao-cv.pdf"
  resume_url_en = ""
  resume_url_fr = ""

  resume_label = "查看简历"

  sectionPagesMenu = "main"

  formspreeendpoint = ""

  pexelsapikey = ""


  # ==========================================================
  # 首页社交图标
  # ==========================================================

  [[params.social]]
    icon = "github"
    url = "https://github.com/xiong-H6776"


# ============================================================
# 标签系统
# ============================================================

[taxonomies]

  tag = "tags"


# ============================================================
# Markdown
# ============================================================

[markup]

  [markup.goldmark]

    [markup.goldmark.renderer]

      unsafe = true

  [markup.highlight]

    style = "monokai"


# ============================================================
# 本地开发服务器
# ============================================================

[server]

  [[server.headers]]

    for = "/**/*.css"

    [server.headers.values]

      Content-Type = "text/css"


# ============================================================
# Hugo 安全配置
# ============================================================

[security]

  [security.funcs]

    getenv = ['^HUGO_', '^CI$']


# ============================================================
# Node.js 权限
# 当前 Hugo + Tailwind 开发环境需要
# ============================================================

[security.node.permissions]

  disable = true


# ============================================================
# CareerCanvas 固定灰色调
# ============================================================

[params.color_palettes]

  [[params.color_palettes.palette]]

    name = "professional"

    main_color = "#474A51"

    second_color = "#E52521"

    third_color = "#3CB043"


# ============================================================
# Pexels 背景
# ============================================================

[params.pexels]

  queries = [
    "hydrogen energy",
    "renewable energy",
    "engineering"
  ]
