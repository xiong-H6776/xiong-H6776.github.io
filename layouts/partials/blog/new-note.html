{{ if eq hugo.Environment "development" }}
<div
  class="xh-blog-new-note-wrap"
  data-new-note-root
  data-language="{{ .Site.Language.Lang }}"
  data-title-prompt="{{ i18n "newNoteTitlePrompt" }}"
  data-save-hint="{{ i18n "newNoteSaveHint" }}"
  data-saved="{{ i18n "newNoteSaved" }}"
  data-downloaded="{{ i18n "newNoteDownloaded" }}"
  data-failed="{{ i18n "newNoteFailed" }}"
>
  <button class="xh-blog-new-note" type="button" data-new-note-button>
    <i class="fas fa-file-circle-plus" aria-hidden="true"></i>
    <span data-new-note-label>{{ i18n "newNote" }}</span>
  </button>
  <p class="xh-blog-new-note-hint">{{ i18n "newNoteSaveHint" }}</p>
  <p class="xh-blog-new-note-status" data-new-note-status role="status" aria-live="polite"></p>

  <script>
  (() => {
    const root = document.currentScript.closest('[data-new-note-root]');
    const button = root?.querySelector('[data-new-note-button]');
    const label = root?.querySelector('[data-new-note-label]');
    const status = root?.querySelector('[data-new-note-status]');
    if (!root || !button || !label || !status) return;

    const originalLabel = label.textContent;
    const language = root.dataset.language;

    const localDate = () => {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const day = String(now.getDate()).padStart(2, '0');
      return `${year}-${month}-${day}`;
    };

    const slugify = (value) => value
      .normalize('NFKC')
      .trim()
      .toLocaleLowerCase(language === 'zh' ? 'zh-CN' : 'en')
      .replace(/[^\p{Letter}\p{Number}]+/gu, '-')
      .replace(/^-+|-+$/g, '') || `note-${localDate()}`;

    const escapeYaml = (value) => value
      .replace(/\\/g, '\\\\')
      .replace(/"/g, '\\"');

    const createTemplate = (title) => {
      const safeTitle = escapeYaml(title);
      const date = localDate();

      if (language === 'en') {
        return `---
title: "${safeTitle}"
description: ""
date: ${date}
categories: ["Study Notes"]
tags: []
draft: true
---

Briefly describe the problem addressed by this note and where it applies.

## Background

## Core Concepts

## Derivation or Practice

## Conclusions and Next Steps
`;
      }

      return `---
title: "${safeTitle}"
description: ""
date: ${date}
categories: ["学习笔记"]
tags: []
draft: true
---

用一小段话说明这篇笔记要解决的问题，以及它适用于什么场景。

## 问题背景

## 核心概念

## 推导或实践

## 结论与待办
`;
    };

    const downloadFallback = (content, filename) => {
      const blob = new Blob([content], { type: 'text/markdown;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    };

    button.addEventListener('click', async () => {
      const title = window.prompt(root.dataset.titlePrompt);
      if (!title?.trim()) return;

      const filename = `${slugify(title)}.md`;
      const content = createTemplate(title.trim());
      button.disabled = true;
      status.textContent = root.dataset.saveHint;

      try {
        if ('showSaveFilePicker' in window) {
          const handle = await window.showSaveFilePicker({
            suggestedName: filename,
            types: [{
              description: 'Markdown',
              accept: { 'text/markdown': ['.md'] }
            }]
          });
          const writable = await handle.createWritable();
          await writable.write(content);
          await writable.close();
          status.textContent = root.dataset.saved;
        } else {
          downloadFallback(content, filename);
          status.textContent = root.dataset.downloaded;
        }
      } catch (error) {
        if (error?.name !== 'AbortError') {
          console.error('Failed to create note:', error);
          status.textContent = root.dataset.failed;
        } else {
          status.textContent = '';
        }
      } finally {
        button.disabled = false;
        label.textContent = originalLabel;
      }
    });
  })();
  </script>
</div>
{{ end }}
